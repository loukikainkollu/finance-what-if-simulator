version: "3.9"

# Production stack with Nginx TLS termination (Let's Encrypt)
# Requires .env.deploy with DOMAIN and LETSENCRYPT_EMAIL

services:
  db:
    extends:
      file: docker-compose.yml
      service: db

  backend:
    extends:
      file: docker-compose.yml
      service: backend
    # Do not expose backend publicly; only internal network
    ports: []

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    # Next.js should call backend through the same domain at /api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=/api
    ports: []

  nginx:
    image: nginx:1.27-alpine
    container_name: financehelper-nginx-prod
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      # Our nginx templates (staging/production)
      - ./docker/nginx/conf.d:/etc/nginx/conf.d-templates:ro
      # Certbot webroot for ACME challenges
      - certbot-www:/var/www/certbot
      # Let's Encrypt certificates (shared with certbot)
      - letsencrypt:/etc/letsencrypt
    command: >
      sh -c '
      cp /etc/nginx/conf.d-templates/production.conf /etc/nginx/conf.d/production.conf && \
      envsubst "$$DOMAIN" < /etc/nginx/conf.d/production.conf > /etc/nginx/conf.d/default.conf && \
      nginx -g "daemon off;"'
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: financehelper-certbot-prod
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Idle container; use Makefile targets to run commands (init, renew)
    entrypoint: "/bin/sh -c"
    command: "trap : TERM INT; sleep infinity & wait"
    restart: unless-stopped

volumes:
  letsencrypt:
  certbot-www: